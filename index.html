      if (!st.seen) { say("The authenticity of host '" + host + "' can't be established. Fingerprint SHA256:abc...xyz. Continue? → yes", "hl"); st.seen = true; }
      if (v("ph-user") !== "anna") { say(v("ph-user") + "@" + host + ": Permission denied (publickey).", "bad"); say("Такого пользователя на сервере нет. Нужен ваш логин на сервере, а не имя телефона.", "hl"); return; }
      if (v("ph-auth") === "keyno") { say("anna@" + host + ": Permission denied (publickey).", "bad"); say("Открытый ключ ещё не у админа. Отправьте ему открытую часть, закрытая остаётся в телефоне.", "hl"); return; }
      if (v("ph-auth") === "pass") say("anna@" + host + "'s password: (набираете, символы не видны)", "dim");
      st.conn = true; st.inTmux = false; say("Подключено. anna@server:~$", "ok");
      if (st.sess) say("Подсказка: у вас есть живая сессия tmux «phone». Вернуться: tmux attach -t phone", "hl");
    }
    $("ph-go").addEventListener("click", connect);
    $("ph-tmux").addEventListener("click", function () {
      if (!st.conn) { say("Сначала подключитесь.", "dim"); return; }
      if (st.inTmux) { say("Вы уже в tmux.", "dim"); return; }
      if (st.sess) { say("duplicate session: phone. Она уже есть, войдите в неё: tmux attach -t phone", "bad"); return; }
      st.sess = true; st.inTmux = true; say("Создана сессия «phone». Зелёная полоса внизу — вы в tmux.", "ok");
    });
    $("ph-att").addEventListener("click", function () {
      if (!st.conn) { say("Сначала подключитесь.", "dim"); return; }
      if (!st.sess) { say("no sessions: сессии ещё нет, создайте её: tmux new -s phone", "bad"); return; }
      if (st.inTmux) { say("Вы уже внутри.", "dim"); return; }
      st.inTmux = true; say("Вы вернулись в «phone». " + (st.task ? (st.task.dead ? "" : "Задача на месте: " + Math.floor(st.task.p) + "%.") : "Всё как было."), "ok");
    });
    $("ph-task").addEventListener("click", function () {
      if (!st.conn) { say("Сначала подключитесь.", "dim"); return; }
      st.task = { p: 0, dead: false, tmux: st.inTmux }; say("Запущен долгий импорт" + (st.inTmux ? " внутри tmux." : " БЕЗ tmux — рискованно на телефоне."), st.inTmux ? "ok" : "hl");
    });
    $("ph-bg").addEventListener("click", function () {
      if (!st.conn) { say("Вы и так не подключены.", "dim"); return; }
      st.conn = false; st.inTmux = false;
      say("Вы ушли в другое приложение. Через пару минут iPhone усыпил терминал: Connection closed. Disconnected.", "hl");
      if (st.task && !st.task.dead) {
        if (st.task.tmux) { st.task.p = Math.min(100, st.task.p + 60); say("Задача в tmux работала дальше без вас: уже " + Math.floor(st.task.p) + "%.", "ok"); }
        else { st.task.dead = true; say("Задача была вне tmux: получила сигнал обрыва и умерла.", "bad"); }
      }
    });
    $("ph-back").addEventListener("click", function () { if (st.conn) { say("Связь и так есть.", "dim"); return; } connect(); });
    $("ph-host").addEventListener("change", function () { st.conn = false; });
    reset();
  }

  function initHabits() {
    var S = [
      ["Перед rm *.log сначала выполнить ls *.log", 1, "Так вы увидите, что попадёт под удаление."],
      ["Работать весь день под root, чтобы не вводить sudo", 0, "Любая опечатка станет катастрофой, и система её не остановит."],
      ["Скопировать nginx.conf в nginx.conf.bak перед правкой", 1, "Всегда можно откатиться."],
      ["Запустить двухчасовой импорт прямо в окне SSH", 0, "Обрыв связи убьёт импорт. Сначала tmux."],
      ["Вставить в терминал команду из форума с sudo, не читая", 0, "С правами root непонятная команда может сделать что угодно."],
      ["Набирать пути через Tab", 1, "Меньше опечаток, и сразу видно, что путь существует."],
      ["Прислать коллеге скриншот с паролем, чтобы помочь", 0, "Пароли и ключи никому, даже в скриншоте."],
      ["Нажать Ctrl+C, когда команда делает непонятное", 1, "Остановить почти всегда безопаснее."],
      ["Написать rm -rf / tmp/старое (с пробелом после /)", 0, "Пробел превращает это в «удалить всё от корня». Одна из самых страшных опечаток."]
    ];
    var box = $("hb-list");
    S.forEach(function (s) {
      var d = el("div", { class: "sort-item" });
      d.innerHTML = '<span class="sit"></span><span class="row"><button class="btn">Безопасно</button><button class="btn">Опасно</button></span><span class="why" hidden></span>';
      d.querySelector(".sit").textContent = s[0];
      var bs = d.querySelectorAll("button"), why = d.querySelector(".why");
      [1, 0].forEach(function (v, i) {
        bs[i].addEventListener("click", function () {
          var ok = v === s[1]; why.hidden = false; why.className = "why " + (ok ? "ok" : "bad");
          why.textContent = (ok ? "Верно. " : "Нет. ") + s[2];
          bs[0].classList.remove("on"); bs[1].classList.remove("on"); bs[i].classList.add("on");
        });
      });
      box.appendChild(d);
    });
  }

  function initExam() {
    var stat = $("ex-stat"), box = $("ex-box"), res = $("ex-res");
    function showStat() {
      var b = examBest();
      stat.innerHTML = b ? "<b>Лучший результат: " + b + "%.</b> " + (b >= EXAM_PASS ? "Экзамен сдан, звание «Почти админ» ваше 😎" : "Для звания нужно " + EXAM_PASS + "%.") : "<b>Экзамен ещё не сдавался.</b> За сдачу +" + EXAM_BONUS + " баллов и звание «Почти админ».";
    }
    $("ex-start").addEventListener("click", function () {
      box.innerHTML = ""; res.hidden = true;
      var all = []; QUIZZED.forEach(function (l) { all = all.concat(allQids(l)); });
      for (var i = all.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = all[i]; all[i] = all[j]; all[j] = t; }
      var pickd = all.slice(0, EXAM_N), answered = 0, right = 0;
      pickd.forEach(function (qid, n) {
        var node = qnode(qid);
        node.querySelector(".qt").insertBefore(el("span", { class: "n" }, (n + 1) + ". "), node.querySelector(".qt").firstChild);
        box.appendChild(node);
        wireQ(node, "exam", function (ok) {
          answered++; if (ok) right++;
          if (answered === EXAM_N) {
            var pct = Math.round(right / EXAM_N * 100), pass = pct >= EXAM_PASS;
            if (pct > examBest()) store("lx-exam", pct);
            res.hidden = false; res.className = "lstatus" + (pass ? " full" : "");
            res.innerHTML = pass ? "<b>Сдано: " + right + " из " + EXAM_N + " (" + pct + "%).</b> Поздравляю, теперь вы «Почти админ» 😎 +" + EXAM_BONUS + " баллов." : "<b>" + right + " из " + EXAM_N + " (" + pct + "%).</b> Для звания нужно " + EXAM_PASS + "%. Вопросы с ошибками уже попали в повторялку. Повторите и пересдайте.";
            showStat(); renderNav("exam");
            res.scrollIntoView({ behavior: "smooth", block: "center" });
          }
        });
      });
      $("ex-start").textContent = "Начать заново";
    });
    showStat();
  }

  var INIT = { start: function () { renderMap("map"); }, arch: initArch, users: initUsers, groups: initGroups, perms: initPerms, procs: initProcs, jobs: initJobs, tmux: initTmux, sandbox: initSandbox, paths: initPaths, cmd: initCmd, files: initFiles, edit: initEdit, errors: initErrors, sudo: initSudo, phone: initPhone, habits: initHabits, final: initFinal, exam: initExam, review: initReview };

  function route() {
    cleanup.forEach(function (f) { f(); }); cleanup = [];
    var id = (location.hash || "").replace("#", "");
    var idx = LESSONS.map(function (l) { return l.id; }).indexOf(id);
    if (idx < 0) { idx = 0; id = "start"; }
    var main = $("main"); main.innerHTML = "";
    if (!unlocked(id)) {
      var b = blocker(id);
      main.appendChild(el("article", { class: "lesson" }, '<header class="lesson-head"><span class="eyebrow">Урок закрыт</span><h2>🔒 ' + NAME[id] + '</h2><p class="lead">Сначала пройдите урок «' + NAME[b] + '» на 100%: верно ответьте на все его вопросы. Сейчас там верно ' + solvedCount(b) + " из " + QCOUNT[b] + '.</p></header><p><a class="btn primary" href="#' + b + '">Перейти к уроку «' + NAME[b] + '»</a></p>'));
      renderNav(id); window.scrollTo(0, 0); return;
    }
    main.appendChild($("t-" + id).content.cloneNode(true));
    pager(main, idx);
    INIT[id]();
    if (QUIZZED.indexOf(id) >= 0) wireLesson(main, id);
    renderNav(id);
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  if (!STORE_OK) {
    var sw = $("store-warn"); sw.hidden = false;
    sw.textContent = "⚠ Этот браузер не даёт сохранять прогресс (частный режим или встроенный браузер чата). Откройте курс в обычном Safari или Chrome, иначе после закрытия всё обнулится. Можно также сохранить код прогресса ниже.";
  }
  $("transfer").addEventListener("toggle", function () { if ($("transfer").open) { $("tr-code").value = exportCode(); $("tr-msg").textContent = ""; } });
  $("tr-copy").addEventListener("click", function () {
    var t = $("tr-code"); t.value = exportCode();
    function sel() { t.focus(); t.select(); $("tr-msg").textContent = "Код выделен: скопируйте его вручную."; }
    try { navigator.clipboard.writeText(t.value).then(function () { $("tr-msg").textContent = "Код скопирован. Сохраните его, например отправьте себе в чат."; }, sel); } catch (e) { sel(); }
  });
  $("tr-load").addEventListener("click", function () {
    try { importCode($("tr-code").value); $("tr-msg").textContent = "Прогресс восстановлен."; route(); }
    catch (e) { $("tr-msg").textContent = "Не получилось: " + e.message; }
  });
  route();
})();
</script>
