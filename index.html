<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important} body{margin:0} img{max-width:100%}</style>
<title>Linux для пользователя</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: left rail of lessons (a real sequence), one lesson at a time in a reading column; each lesson = idea -> live model -> check */
:root {
  --bg: #F2F4F7;
  --surface: #FFFFFF;
  --ink: #17202C;
  --muted: #586477;
  --line: #D8DEE7;
  --accent: #2D57CC;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3E9FA;
  --amber: #A85A0A;
  --amber-soft: #FBEEDD;
  --ok: #1B7F4B;
  --ok-soft: #DDF2E6;
  --bad: #BB3434;
  --bad-soft: #F8E1E1;
  --term-bg: #15202D;
  --term-fg: #D5E0EC;
  --term-dim: #7F92A8;
  --tmux: #2E8B57;
  --f-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E131A; --surface: #161D27; --ink: #E5EBF2; --muted: #96A2B3; --line: #2A3443;
    --accent: #7E9DF4; --accent-ink: #0E131A; --accent-soft: #1E2A46;
    --amber: #E59D4C; --amber-soft: #33261A; --ok: #4FC487; --ok-soft: #173326;
    --bad: #EE7676; --bad-soft: #3A1E22; --term-bg: #0A0F15; --term-fg: #D5E0EC; --term-dim: #71849A;
    --tmux: #4FC487; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E131A; --surface: #161D27; --ink: #E5EBF2; --muted: #96A2B3; --line: #2A3443;
  --accent: #7E9DF4; --accent-ink: #0E131A; --accent-soft: #1E2A46;
  --amber: #E59D4C; --amber-soft: #33261A; --ok: #4FC487; --ok-soft: #173326;
  --bad: #EE7676; --bad-soft: #3A1E22; --term-bg: #0A0F15; --term-fg: #D5E0EC; --term-dim: #71849A;
  --tmux: #4FC487; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.6; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: 2rem; }
h2 { font-size: 1.55rem; }
h3 { font-size: 1.12rem; }
p { margin: 0; }
code, .mono { font-family: var(--f-mono); font-size: .92em; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 270px minmax(0, 1fr); min-height: 100vh; }
.rail { border-right: 1px solid var(--line); background: var(--surface); padding-block: 28px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: 20px; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 22px; }
.brand { display: flex; flex-direction: column; gap: 4px; }
.brand .kicker { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.brand h1 { font-size: 1.35rem; }
.nav { display: flex; flex-direction: column; gap: 2px; list-style: none; margin: 0; padding: 0; }
.nav a { display: grid; grid-template-columns: 28px 1fr 18px; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: .95rem; }
.nav a:hover { background: var(--accent-soft); }
.nav a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.nav .n { font-family: var(--f-mono); font-size: .78rem; opacity: .75; }
.nav .done { font-size: .8rem; color: var(--ok); }
.nav a[aria-current="page"] .done { color: var(--accent-ink); }
.progress-box { margin-top: auto; font-size: .85rem; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .4s; }

main { padding-block: 40px 80px; padding-left: max(16px, 4vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 4vw); }
.lesson { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.lesson-head { display: flex; flex-direction: column; gap: 10px; }
.eyebrow { font-family: var(--f-mono); font-size: .75rem; letter-spacing: .09em; text-transform: uppercase; color: var(--amber); }
.lead { font-size: 1.12rem; color: var(--muted); max-width: 65ch; }
.prose { display: flex; flex-direction: column; gap: 14px; max-width: 68ch; }
.prose ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
.big-idea { border-left: 4px solid var(--amber); background: var(--amber-soft); padding: 14px 18px; border-radius: 0 10px 10px 0; max-width: 68ch; }
.big-idea b { font-family: var(--f-display); }
.trap { border: 1px dashed var(--bad); background: var(--bad-soft); padding: 12px 16px; border-radius: 10px; max-width: 68ch; }
.trap b { color: var(--bad); }

.lab { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.lab-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.lab-title .tag { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 1px 6px; }
.lab-hint { color: var(--muted); font-size: .92rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--bg); padding: 7px 13px; border-radius: 8px; font-size: .92rem; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.warn { border-color: var(--bad); color: var(--bad); background: transparent; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.on { background: var(--accent-soft); border-color: var(--accent); }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 12px; text-align: left; background: var(--bg); display: flex; flex-direction: column; gap: 4px; }
.card.sel { border-color: var(--accent); background: var(--accent-soft); }
.card .who { font-family: var(--f-display); font-weight: 700; }
.card .what { font-size: .82rem; color: var(--muted); }
.detail { border-top: 1px solid var(--line); padding-top: 14px; display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: .95rem; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; }

.tablewrap { overflow-x: auto; }
table.matrix { border-collapse: collapse; font-size: .93rem; min-width: 420px; }
.matrix th, .matrix td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: center; }
.matrix th:first-child, .matrix td:first-child { text-align: left; }
.matrix thead th { font-weight: 600; color: var(--muted); font-size: .82rem; }
.pill { display: inline-block; font-size: .78rem; font-weight: 600; padding: 2px 9px; border-radius: 99px; }
.pill.yes { background: var(--ok-soft); color: var(--ok); }
.pill.no { background: var(--bad-soft); color: var(--bad); }
.pill.mid { background: var(--amber-soft); color: var(--amber); }
.filecard { font-family: var(--f-mono); font-size: .9rem; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }

.permgrid { display: grid; grid-template-columns: max-content repeat(3, 1fr); gap: 8px; align-items: center; }
.permgrid .lbl { font-size: .9rem; }
.permgrid .lbl small { display: block; color: var(--muted); font-size: .78rem; }
.permgrid .colh { font-family: var(--f-mono); text-align: center; color: var(--muted); font-size: .8rem; }
.bit { font-family: var(--f-mono); font-weight: 600; border: 1px solid var(--line); border-radius: 8px; padding: 8px 0; background: var(--bg); }
.bit.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.permstr { font-family: var(--f-mono); font-size: 1.5rem; letter-spacing: .06em; display: flex; flex-wrap: wrap; gap: 14px; align-items: baseline; }
.permstr span.o { color: var(--muted); font-size: 1rem; }
.verdicts { display: grid; gap: 8px; }
.verdict { display: grid; grid-template-columns: minmax(120px, 180px) 1fr; gap: 10px; align-items: start; font-size: .93rem; }
.verdict .who { font-weight: 600; }
.verdict .acts { display: flex; flex-wrap: wrap; gap: 6px; }
.warns { display: flex; flex-direction: column; gap: 6px; }
.warn-line { font-size: .9rem; color: var(--bad); }

.term { background: var(--term-bg); color: var(--term-fg); font-family: var(--f-mono); font-size: .85rem; border-radius: 10px; padding: 14px; min-height: 120px; display: flex; flex-direction: column; gap: 3px; overflow-x: auto; }
.term .dim { color: var(--term-dim); }
.term .hl { color: #F0B35A; }
.term .ok { color: #6FD39C; }
.term .bad { color: #F08A8A; }

.ptree { display: flex; flex-direction: column; gap: 6px; font-size: .93rem; }
.pnode { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: var(--bg); text-align: left; }
.pnode.sel { border-color: var(--accent); background: var(--accent-soft); }
.pnode.dead { opacity: .5; text-decoration: line-through; }
.pnode .pid { font-family: var(--f-mono); font-size: .78rem; color: var(--muted); }
.pnode .owner { font-size: .78rem; color: var(--muted); }

.jobs { display: flex; flex-direction: column; gap: 8px; }
.job { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--bg); }
.job .name { font-weight: 600; }
.job .jbar { grid-column: 1 / -1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.job .jbar i { display: block; height: 100%; background: var(--accent); }
.job.fg { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.kb { font-size: .9rem; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); }

.net { display: grid; grid-template-columns: 1fr 90px 1.4fr; gap: 0; align-items: stretch; }
.box { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--bg); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.box h4 { margin: 0; font-family: var(--f-display); font-size: .95rem; }
.link { display: flex; align-items: center; justify-content: center; position: relative; }
.link::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 3px solid var(--ok); }
.link.cut::before { border-top: 3px dashed var(--bad); }
.link span { position: relative; background: var(--surface); padding: 0 6px; font-size: .75rem; color: var(--muted); }
.inner { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); font-size: .88rem; display: flex; flex-direction: column; gap: 6px; }
.inner.tmux { border-color: var(--tmux); }
.inner.tmux > .t { color: var(--tmux); font-weight: 600; }
.inner.dead { opacity: .5; text-decoration: line-through; }

.tmuxwin { border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--term-bg); }
.panes { display: grid; gap: 2px; background: var(--tmux); min-height: 180px; }
.pane { background: var(--term-bg); color: var(--term-fg); font-family: var(--f-mono); font-size: .8rem; padding: 10px; border: 0; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.pane.act { outline: 2px solid var(--tmux); outline-offset: -2px; }
.pane .dim { color: var(--term-dim); }
.status { background: var(--tmux); color: #0B1A12; font-family: var(--f-mono); font-size: .8rem; display: flex; flex-wrap: wrap; gap: 2px 12px; padding: 4px 10px; }
.status b { font-weight: 600; }
.status .w { cursor: pointer; background: none; border: 0; padding: 0; color: inherit; font: inherit; }
.status .w.act { text-decoration: underline; font-weight: 700; }

.layers { display: flex; flex-direction: column; gap: 6px; }
.layer { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "n tag" "d tag"; gap: 0 12px; align-items: center; text-align: left; border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; background: var(--bg); }
.layer b { grid-area: n; font-family: var(--f-display); }
.layer > span:not(.same):not(.diff) { grid-area: d; font-size: .85rem; color: var(--muted); }
.layer .same, .layer .diff { grid-area: tag; font-size: .72rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; }
.layer .same { background: var(--ok-soft); color: var(--ok); }
.layer .diff { background: var(--amber-soft); color: var(--amber); }
.layer.kernel { border-width: 2px; border-color: var(--amber); }
.layer.sel { background: var(--accent-soft); border-color: var(--accent); }
.layer-info { font-size: .95rem; border-top: 1px solid var(--line); padding-top: 12px; max-width: 68ch; }
.navpart { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--amber); padding: 12px 10px 4px; white-space: nowrap; }
.rank { font-family: var(--f-display); font-weight: 700; color: var(--accent); font-size: 1rem; }
.inp { font: inherit; font-family: var(--f-mono); font-size: .92rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; flex: 1 1 220px; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; border-radius: 8px; padding: 6px 10px; border: 1px solid var(--line); background: var(--bg); }
.chip code { font-weight: 600; }
.chip small { font-size: .7rem; color: var(--muted); }
.chip.cmd { border-color: var(--accent); background: var(--accent-soft); }
.chip.opt { border-color: var(--amber); background: var(--amber-soft); }
.chip.arg { border-color: var(--ok); background: var(--ok-soft); }
.chip.sudo { border-color: var(--bad); background: var(--bad-soft); }
.steps { display: flex; flex-direction: column; gap: 8px; }
.step { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--bg); cursor: pointer; }
.step input { margin-top: 5px; width: 18px; height: 18px; }
.step.done { border-color: var(--ok); background: var(--ok-soft); }
.tasks { display: flex; flex-direction: column; gap: 4px; font-size: .93rem; }
.task.ok { color: var(--ok); font-weight: 600; }
.card.hiddenf { opacity: .7; border-style: dashed; }
.vim { background: var(--term-bg); color: var(--term-fg); font-family: var(--f-mono); font-size: .88rem; border-radius: 10px; overflow: hidden; }
.vbuf { padding: 12px; white-space: pre-wrap; min-height: 100px; }
.vbar { padding: 4px 12px; background: rgba(255,255,255,.08); min-height: 1.6em; }
.vmode { padding: 4px 12px; font-size: .75rem; color: var(--term-dim); }
.sorter { display: flex; flex-direction: column; gap: 8px; }
.sort-item { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--bg); display: flex; flex-direction: column; gap: 8px; }
.ex ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; }
.transfer { font-size: .85rem; }
.transfer summary { cursor: pointer; color: var(--accent); }
.transfer[open] { display: flex; flex-direction: column; gap: 8px; }
.transfer textarea { font-size: .72rem; width: 100%; resize: vertical; }
.cheat td:nth-child(2) { white-space: normal; }
.cheat td { text-align: left !important; }
.tmsim { background: var(--term-bg); color: var(--term-fg); font-family: var(--f-mono); font-size: .85rem; border-radius: 10px; overflow: hidden; }
.tm-body { padding: 12px; display: flex; flex-direction: column; gap: 4px; min-height: 120px; }
.tm-body .dim { color: var(--term-dim); }
.tm-panes { display: grid; gap: 2px; background: var(--tmux); min-height: 110px; }
.tm-pane { background: var(--term-bg); padding: 10px; }
.tm-tree { padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.tm-tree .dim { color: var(--term-dim); margin-bottom: 6px; }
.tm-node { background: none; border: 0; color: var(--term-fg); font: inherit; text-align: left; padding: 3px 6px; border-radius: 4px; white-space: pre; cursor: pointer; }
.tm-node:hover, .tm-node:focus-visible { background: rgba(255,255,255,.12); }
.tm-node.sub { color: #9FD3B5; }
.steps-static { display: grid; gap: 10px; }
.tm-scroll { background: #F0B35A; color: #1a1a1a; padding: 3px 10px; font-size: .78rem; }
.phform { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.phform label { display: flex; flex-direction: column; gap: 4px; font-size: .88rem; color: var(--muted); }
.examples { display: grid; gap: 10px; }
.ex { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--surface); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ex .sit { font-weight: 600; }
.ex .term, .q .term { display: block; white-space: pre; min-height: 0; }
.review { border: 2px dashed var(--accent); border-radius: 14px; padding: 18px; background: var(--accent-soft); display: flex; flex-direction: column; gap: 12px; }
.from { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; color: var(--amber); }
.qpts { margin-left: 8px; font-size: .8rem; font-weight: 700; color: var(--ok); }
.lstatus { border: 1px solid var(--amber); background: var(--amber-soft); border-radius: 10px; padding: 12px 16px; }
.lstatus.full { border-color: var(--ok); background: var(--ok-soft); }
.nav a.locked { opacity: .55; }
.score { font-family: var(--f-display); font-size: 1.05rem; color: var(--ink); }
.quiz { display: flex; flex-direction: column; gap: 14px; }
.q { border: 1px solid var(--line); border-radius: 12px; padding: 16px; background: var(--surface); display: flex; flex-direction: column; gap: 10px; }
.q .qt { font-weight: 600; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 12px; }
.opt:hover { border-color: var(--accent); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.why { font-size: .92rem; color: var(--muted); }
.why.ok { color: var(--ok); }
.why.bad { color: var(--bad); }

.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 20px; }
.pager a { text-decoration: none; color: var(--accent); font-weight: 600; }
.map { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.map a { text-decoration: none; color: inherit; border: 1px solid var(--line); border-radius: 10px; padding: 14px; background: var(--surface); display: flex; flex-direction: column; gap: 4px; }
.map a:hover { border-color: var(--accent); }
.map .n { font-family: var(--f-mono); font-size: .75rem; color: var(--amber); }
.map b { font-family: var(--f-display); }
.map small { color: var(--muted); }

@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 12px; }
  .nav { flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  .nav a { grid-template-columns: auto auto auto; white-space: nowrap; }
  .progress-box { margin-top: 0; }
  main { padding-block: 24px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 1.6rem; }
  .net { grid-template-columns: minmax(0, 1fr); }
  .link { height: 44px; }
  .link::before { left: 50%; right: auto; top: 0; bottom: 0; border-top: 0; border-left: 3px solid var(--ok); }
  .link.cut::before { border-top: 0; border-left: 3px dashed var(--bad); }
  .verdict { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .permgrid { grid-template-columns: minmax(0, 1.3fr) repeat(3, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <aside class="rail">
    <div class="brand">

      <h2>Пользователь — это не человек, а удостоверение</h2>
      <p class="lead">Linux не знает, кто сидит за клавиатурой. Он знает только, под каким именем вы вошли, и всё решает по этому имени.</p>
    </header>
    <div class="prose">
      <p>Когда вы входите в систему, вам выдают удостоверение. Дальше каждое ваше действие подписано им: открыть файл, запустить программу, удалить папку. Система смотрит на подпись и решает, можно или нельзя.</p>
      <ul>
        <li><b>Внутри имя — это номер.</b> Для людей пользователь называется <code>anna</code>, а система хранит его как число, например 1001. Если два имени получили одно число, система считает их одним человеком.</li>
        <li><b>Не все пользователи — люди.</b> Веб-сервер, база данных, почтовая служба работают под своими отдельными пользователями. Это сделано для безопасности: если взломают веб-сервер, взломщик получит только его скромные права, а не ваши.</li>
        <li><b>У каждого есть дом.</b> Домашняя папка (<code>/home/anna</code>) принадлежит вам. Там ваши файлы и настройки, и по умолчанию остальные туда не лезут.</li>
        <li><b>Есть root.</b> Суперпользователь с номером 0. Для него проверки прав почти не делаются. Работать под ним постоянно опасно по той же причине: система не остановит его ошибку.</li>
      </ul>
    </div>

      <div class="cards" id="users-cards"></div>
      <dl class="detail" id="users-detail"></dl>
    </section>
    <div class="big-idea"><b>Главное.</b> Права принадлежат не вам лично и не программе, а удостоверению. Любая программа, которую вы запустили, работает под вашим именем и может ровно то же, что и вы.</div>
    <h3>Примеры из жизни</h3>
    <div class="examples">
      <div class="ex"><p class="sit">Вы спросили систему, кто вы такой. Она показала ваше удостоверение целиком.</p><div class="term">uid=1001(anna) gid=1001(anna) groups=1001(anna),1005(buh)</div><p><b>Как читать.</b> <code>uid</code> — ваш номер и имя. <code>gid</code> — основная группа. <code>groups</code> — все группы, где вы состоите. Здесь Анна в двух группах: своей личной <code>anna</code> и <code>buh</code> (бухгалтерия).</p></div>
      <div class="ex"><p class="sit">В начале строки терминала видно, кто вы и где.</p><div class="term">anna@server:~$
root@server:~#</div><p><b>Как читать.</b> До <code>@</code> — пользователь, после — имя машины, <code>~</code> — вы в домашней папке. Знак <code>$</code> значит обычный пользователь, <code>#</code> значит root. Увидели <code>#</code> — будьте осторожны, система вас не остановит.</p></div>

anna      4120  python bot.py
root         1  systemd</div><p><b>Как читать.</b> Первый столбец — владелец процесса. Веб-сервер работает под <code>www-data</code>, бот Анны — под <code>anna</code>, главный системный процесс — под <code>root</code>.</p></div>

    <section class="quiz">

<template id="t-perms">
  <article class="lesson">
    <header class="lesson-head">
      <span class="eyebrow">Урок 4 · Права</span>
      <h2>Три вопроса и три разрешения</h2>
      <p class="lead">На каждом файле и каждой папке написано, кто владелец, какая группа и что можно делать трём категориям людей.</p>
    </header>
    <div class="prose">
      <p>Категорий ровно три: <b>владелец</b>, <b>члены группы файла</b> и <b>все остальные</b>. Для каждой стоят три разрешения: <b>r</b> (чтение), <b>w</b> (запись), <b>x</b> (выполнение). Отсюда знаменитая строчка из девяти символов вроде <code>rw-r-----</code>.</p>
      <p>Система проверяет вас по порядку и <b>останавливается на первом совпадении</b>:</p>
      <ul>
        <li>Вы владелец? Тогда действуют права владельца, и больше ничего не смотрится.</li>
        <li>Не владелец, но в группе файла? Действуют права группы.</li>
        <li>Иначе действуют права «остальных».</li>
      </ul>
    </div>
    <div class="big-idea"><b>Для папки буквы значат другое.</b> Папка — это список имён. <b>r</b> позволяет прочитать этот список. <b>w</b> позволяет его менять: создавать, переименовывать и <b>удалять</b> файлы. <b>x</b> позволяет войти в папку и пройти сквозь неё к файлам. Отсюда неожиданное следствие: удалить файл можно, имея право записи в папку, даже если сам файл вам писать нельзя.</div>
    <section class="lab">
      <div class="lab-title"><span class="tag">модель</span><h3>Конструктор прав</h3></div>
      <div class="row" id="p-kind">
        <button class="btn on" data-kind="file">Это файл</button>
        <button class="btn" data-kind="dir">Это папка</button>
      </div>
      <div class="row" id="p-presets"></div>
      <div class="permgrid" id="p-grid"></div>
      <div class="permstr" id="p-str"></div>
      <div class="verdicts" id="p-verdicts"></div>
      <div class="warns" id="p-warns"></div>
    </section>
    <div class="trap"><b>Ловушка.</b> Если у владельца прав меньше, чем у группы, владелец всё равно получает только свои. Проверка остановилась на первом вопросе, до группы она не дошла. Попробуйте в конструкторе шаблон «Странный».</div>
    <h3>Примеры из жизни</h3>
    <div class="examples">
      <div class="ex"><div class="term">-rwxr-xr-x 1 anna dev 900 deploy.sh</div><p><b>Как читать.</b> Первый символ <code>-</code> значит файл (у папки там <code>d</code>). Дальше три тройки: владелец <code>rwx</code> (всё), группа <code>r-x</code> (читать и запускать), остальные <code>r-x</code>. В цифрах это 755: типичный скрипт, который все могут запустить, а менять только Анна.</p></div>
      <div class="ex"><div class="term">drwx------ 12 anna anna 4096 /home/anna</div><p><b>Как читать.</b> Папка, у владельца всё, у остальных ничего. Никто, кроме Анны (и root), не увидит, что внутри, и не войдёт. Так обычно и защищают домашнюю папку.</p></div>
      <div class="ex"><div class="term">drwxrwxrwt 20 root root 4096 /tmp</div><p><b>Как читать.</b> Общая папка для временных файлов: писать могут все. Но в конце стоит <code>t</code>, особый флаг. Он запрещает удалять чужие файлы, хотя право записи в папку есть у всех. Это и есть защита из третьего вопроса ниже.</p></div>
      <div class="ex"><p class="sit">Цифры вместо букв: r = 4, w = 2, x = 1, их складывают для каждой тройки.</p><div class="term">600 = rw- --- ---   личный файл
644 = rw- r-- r--   все читают, пишет владелец
755 = rwx r-x r-x   программа или открытая папка</div></div>
    </div>
    <section class="quiz">
      <h3>Проверь себя на примерах</h3>
      <div class="q" data-q>
        <p class="qt">Посторонний пользователь (не владелец и не из группы) видит этот файл. Что он может?</p>
        <div class="term">-rw-r--r-- 1 anna buh 300 spisok.txt</div>
        <div class="opts">
          <button class="opt" data-ok data-why="Верно. Последняя тройка r--: только чтение.">Только читать</button>

      <div class="q" data-q>

          <button class="opt" data-why="7 означало бы rwx, а 6 — это rw.">Владелец может всё, включая запуск</button>

        <p class="why" hidden></p>
      </div>
    </section>
    <section class="quiz" data-lesson="perms">
      <div class="q" data-q>
        <p class="qt">Файл <code>r--rw----</code>, владелец Анна, Анна состоит в группе файла. Может ли Анна его изменить?</p>

          <button class="opt" data-why="Группа даёт w, но до группы проверка не доходит: Анна совпала как владелец.">Да, через права группы</button>
          <button class="opt" data-ok data-why="Верно. Анна владелец, значит действует только r--. Чтобы писать, ей нужно сначала изменить права, это владелец сделать может.">Нет, для неё действует только r-- владельца</button>
        </div>
        <p class="why" hidden></p>

          <button class="opt" data-why="Удаление требует w на папку.">Сможете удалять файлы</button>

<template id="t-procs">
  <article class="lesson">
    <header class="lesson-head">
      <span class="eyebrow">Урок 5 · Процессы</span>
      <h2>Программа лежит, процесс работает</h2>
      <p class="lead">Файл программы на диске — это рецепт. Процесс — это повар, который прямо сейчас по нему готовит. По одному рецепту могут работать десять поваров одновременно.</p>
    </header>
    <div class="prose">
      <p>У каждого процесса есть три важные вещи:</p>
      <ul>
        <li><b>Номер (PID).</b> Уникальный, пока процесс жив. По нему к процессу обращаются.</li>
        <li><b>Владелец.</b> Удостоверение, под которым он работает. Отсюда его права на файлы. Чужие процессы трогать вы не можете, свои можете.</li>
        <li><b>Родитель.</b> Каждый процесс кем-то запущен. Терминал запускает оболочку, оболочка запускает ваши программы. Получается дерево. Дети наследуют от родителя удостоверение, текущую папку и окружение.</li>
      </ul>
      <p>Процессам можно посылать <b>сигналы</b>, короткие сообщения. Самые важные: «пожалуйста, завершись» (программа может сохраниться и аккуратно выйти), «умри немедленно» (программа не успеет ничего сделать), «замри» и «продолжай». А когда терминал закрывается, всем его детям приходит сигнал «связь оборвалась», и большинство программ на него завершаются.</p>
    </div>
    <section class="lab">

      </div>

      <div class="row" id="pr-sig">
        <span class="lab-hint" id="pr-target">Процесс не выбран</span>

        <button class="btn" data-sig="kill">Убить немедленно</button>
        <button class="btn" data-sig="stop">Заморозить</button>
        <button class="btn" data-sig="cont">Продолжить</button>
      </div>
      <div class="term" id="pr-log"></div>
    </section>
    <div class="big-idea"><b>Главное.</b> «Убить немедленно» — последнее средство. Программа не успевает сохранить данные и убрать за собой. Сначала всегда просят вежливо.</div>
    <h3>Примеры из жизни</h3>

oleg     5210  vim notes.txt</div><p><b>Как читать.</b> Бот Анны — процесс с номером 4120, работает под <code>anna</code>. Анна может послать ему сигнал. Редактор Олега (5210) ей не подвластен: он под удостоверением <code>oleg</code>.</p></div>

      <p class="lead">В одном терминале может работать много программ, но читать с клавиатуры может только одна. Она на переднем плане. Остальные в фоне.</p>

<template id="t-tmux">
  <article class="lesson">
    <header class="lesson-head">
      <span class="eyebrow">Урок 7 · tmux</span>
      <h2>Терминал, который живёт без вас</h2>
      <p class="lead">tmux переносит ваши терминалы с экрана ноутбука на сервер. Окно на ноутбуке становится просто экраном, через который вы на них смотрите.</p>
    </header>
    <div class="prose">
      <p>Без tmux ваша оболочка привязана к соединению. Оборвалась связь, закрылась крышка ноутбука, и вся работа получает сигнал обрыва. С tmux на сервере работает отдельный процесс, <b>сервер tmux</b>. Это он держит оболочки и программы. Вы подключаетесь к нему как <b>клиент</b>, а когда уходите, просто <b>отключаетесь</b>. Работа идёт дальше.</p>
      <ul>
        <li><b>Сессия</b> — рабочее место целиком, со своим именем. Например, «работа» или «бот».</li>
        <li><b>Окна</b> — вкладки внутри сессии, внизу видны в зелёной строке.</li>
        <li><b>Панели</b> — части одного окна, разрезанного на куски, чтобы видеть несколько терминалов разом.</li>
        <li><b>Префикс.</b> Чтобы tmux понял, что клавиши для него, а не для программы, сначала нажимают особое сочетание, по умолчанию Ctrl+B, а потом клавишу действия.</li>
      </ul>
    </div>
    <section class="lab">
      <div class="lab-title"><span class="tag">модель</span><h3>Обрыв связи: с tmux и без</h3></div>

        <button class="btn" data-mode="tmux">С tmux</button>

        <div class="box" id="x-server"></div>
      </div>
      <div class="row">
        <button class="btn primary" id="x-start">Запустить долгую задачу</button>
        <button class="btn warn" id="x-cut">Захлопнуть ноутбук</button>

    <section class="lab">
      <div class="lab-title"><span class="tag">модель</span><h3>Сессия, окна, панели</h3></div>
      <p class="lab-hint">Это вид изнутри одной сессии. Добавьте окно, разрежьте его на панели, переключайтесь. Всё это живёт на сервере.</p>
      <div class="row">

      </div>

    <h3>tmux руками: команды на каждый день</h3>
    <div class="prose">
      <p>Все действия внутри tmux начинаются с <b>префикса</b>: нажать <b>Ctrl+B</b>, отпустить, потом нажать клавишу действия. Не одновременно, а по очереди. Команды вне tmux набираются в обычной оболочке.</p>
    </div>
    <div class="tablewrap"><table class="matrix cheat">
      <thead><tr><th>Что нужно</th><th>Что набрать или нажать</th><th>Где</th></tr></thead>
      <tbody>

        <tr><td>Создать сессию с понятным именем</td><td><code>tmux new -s rabota</code></td><td>в оболочке</td></tr>
        <tr><td><b>Свернуть: выйти, а всё оставить работать</b></td><td><b>Ctrl+B, потом d</b> (detach)</td><td>в tmux</td></tr>
        <tr><td>Посмотреть, какие сессии живут</td><td><code>tmux ls</code></td><td>в оболочке</td></tr>
        <tr><td><b>Вернуться в сессию</b> (весь контекст на месте)</td><td><code>tmux attach -t rabota</code> или коротко <code>tmux a</code> (в последнюю)</td><td>в оболочке</td></tr>
        <tr><td>Новое окно (вкладка)</td><td>Ctrl+B, потом c</td><td>в tmux</td></tr>
        <tr><td>Следующее или предыдущее окно</td><td>Ctrl+B, потом n / p</td><td>в tmux</td></tr>
        <tr><td>Окно по номеру</td><td>Ctrl+B, потом 0…9</td><td>в tmux</td></tr>
        <tr><td>Разрезать окно слева-направо / сверху-вниз</td><td>Ctrl+B, потом % / "</td><td>в tmux</td></tr>
        <tr><td>Перейти в другую панель</td><td>Ctrl+B, потом стрелка</td><td>в tmux</td></tr>
        <tr><td>Прокрутить вверх, почитать старый вывод</td><td>Ctrl+B, потом [ ; листать стрелками; выйти — q</td><td>в tmux</td></tr>
        <tr><td>Переименовать окно</td><td>Ctrl+B, потом ,</td><td>в tmux</td></tr>
        <tr><td>Закрыть панель или окно</td><td><code>exit</code> (закрывается оболочка в ней)</td><td>в tmux</td></tr>
        <tr><td>Закрыть окно целиком, со всеми панелями</td><td>Ctrl+B, потом &amp;, подтвердить y</td><td>в tmux</td></tr>
        <tr><td>Спрятать окно, оставив работать</td><td><code>tmux new -d -s sklad</code> один раз, потом Ctrl+B, : и <code>move-window -t sklad:</code></td><td>в tmux</td></tr>
        <tr><td>Вернуть спрятанное окно</td><td>Ctrl+B, : и <code>move-window -s sklad:имя</code></td><td>в tmux</td></tr>
        <tr><td><b>Дерево всех сессий и окон</b>, перейти в любое</td><td>Ctrl+B, потом w; Enter — перейти, q — выйти, x не нажимать</td><td>в tmux</td></tr>
        <tr><td>Список сессий</td><td>Ctrl+B, потом s</td><td>в tmux</td></tr>
        <tr><td>Предыдущая / следующая сессия</td><td>Ctrl+B, потом ( / )</td><td>в tmux</td></tr>
        <tr><td>Какие окна есть в сессии</td><td><code>tmux list-windows -t sklad</code></td><td>где угодно</td></tr>
        <tr><td>Совсем закрыть сессию со всем внутри</td><td><code>tmux kill-session -t rabota</code></td><td>в оболочке</td></tr>
      </tbody>
    </table></div>
    <div class="trap"><b>Свернуть и закрыть — разные вещи.</b> Ctrl+B, d только отключает вас, а программы внутри работают дальше. <code>exit</code> в последнем окне и <code>kill-session</code> завершают оболочку, и всё, что в ней было запущено, получает сигнал обрыва. Хотите вернуться к работе потом — сворачивайте, а не закрывайте.</div>
    <h3>Пример: окно «rabota». Закрыть, спрятать, вернуть</h3>
    <div class="prose">
      <p>Допустим, внизу зелёная полоса <code>[main] 0:bash  1:rabota*</code>, и в окне «rabota» идёт ваша работа. С ним можно сделать три разные вещи:</p>
    </div>
    <div class="examples">
      <div class="ex"><p class="sit">1. Закрыть насовсем</p><div class="term">exit
или Ctrl+B, потом &amp;  →  kill-window rabota? (y/n)  →  y</div><p><b>Что будет.</b> Окно исчезнет из полосы вместе со всем, что в нём было. Программы получат сигнал обрыва. <b>Открыть «его же» потом нельзя</b>, можно только создать новое пустое окно с тем же именем: <code>tmux new-window -n rabota</code>.</p></div>
      <div class="ex"><p class="sit">2. Убрать из полосы, но оставить работать</p><div class="term">tmux new -d -s sklad          (один раз: создать сессию-склад)
Ctrl+B, потом :  →  move-window -t sklad:</div><p><b>Что будет.</b> Свернуть одно окно tmux не умеет: сворачивается только сессия целиком. Поэтому окно <b>переносят в другую сессию</b>, «склад». Оно пропадает из вашей полосы, но живёт на складе, и программы в нём работают. Флаг <code>-d</code> значит «создать, но не входить», так что набрать это можно прямо внутри tmux. Двоеточие после <code>sklad</code> обязательно: это значит «в сессию sklad».</p></div>
      <div class="ex"><p class="sit">3. Вернуть то же самое окно</p><div class="term">Ctrl+B, потом :  →  move-window -s sklad:rabota</div><p><b>Что будет.</b> Окно «rabota» вернётся в текущую сессию, в полосу внизу, со всем выводом и работающими программами. Посмотреть, что лежит на складе: <code>tmux list-windows -t sklad</code>.</p></div>
      <div class="ex"><p class="sit">Проще: держать работу отдельной сессией с самого начала</p><div class="term">tmux new -s rabota      создать
Ctrl+B, потом d         свернуть: пропала с экрана, но живёт
tmux attach -t rabota   вернуть то же самое</div><p><b>Совет.</b> Если что-то нужно часто прятать и возвращать, сделайте это отдельной <b>сессией</b>, а не окном. Сессии сворачиваются и возвращаются одной командой, без склада.</p></div>
    </div>
    <section class="quiz">
      <h3>Проверь себя: окно «rabota»</h3>
      <div class="q" data-q data-extra>
        <p class="qt">Вы закрыли окно «rabota» через exit. Как открыть его же, со старым выводом и программами?</p>
        <div class="opts">
          <button class="opt" data-why="Это создаст новое пустое окно с тем же именем, старого содержимого там не будет.">tmux new-window -n rabota</button>
          <button class="opt" data-ok data-why="Верно. exit завершает оболочку окна, и содержимое пропадает. Чтобы можно было вернуться, окно надо было перенести на склад или свернуть сессию.">Никак: закрытое окно не вернуть, можно только создать новое с тем же именем</button>
          <button class="opt" data-why="attach возвращает в сессию, а закрытого окна в ней уже нет.">tmux attach -t rabota</button>
        </div>
        <p class="why" hidden></p>
      </div>
      <div class="q" data-q data-extra>
        <p class="qt">Как убрать окно «rabota» из зелёной полосы, чтобы оно продолжало работать?</p>
        <div class="opts">
          <button class="opt" data-why="Ctrl+B, d сворачивает всю сессию, а не одно окно.">Ctrl+B, потом d</button>
          <button class="opt" data-ok data-why="Верно. Окно переезжает в сессию sklad, исчезает из вашей полосы и живёт там.">Перенести его в другую сессию: Ctrl+B, : и move-window -t sklad:</button>
          <button class="opt" data-why="& закрывает окно насовсем.">Ctrl+B, потом &amp;</button>
        </div>
        <p class="why" hidden></p>
      </div>
      <div class="q" data-q data-extra>
        <p class="qt">Окно «rabota» лежит в сессии sklad. Как вернуть его к себе?</p>
        <div class="opts">
          <button class="opt" data-ok data-why="Верно. -s значит «откуда», sklad:rabota — окно rabota из сессии sklad.">Ctrl+B, : и move-window -s sklad:rabota</button>
          <button class="opt" data-why="Это создаст ещё одну сессию со складом, окно не вернётся.">tmux new -s sklad</button>
          <button class="opt" data-why="Это новое пустое окно, а не то же самое.">Ctrl+B, потом c</button>
        </div>
        <p class="why" hidden></p>
      </div>
    </section>
    <h3>Много окон под разные задачи: наводим порядок</h3>
    <div class="prose">
      <p>Типичная картина: в сессии <code>main</code> накопилось десять окон под разные задачи, полоса внизу не помещается на экран. Закрывать нельзя, к задачам нужно возвращаться. План из четырёх шагов:</p>
    </div>
    <div class="steps-static">
      <div class="ex"><p class="sit">Шаг 0. Дать окнам имена задач</p><div class="term">Ctrl+B, потом ,   →  ввести имя (bot, otchet, logi)  →  Enter</div><p>Пока окна называются <code>bash</code>, их не различить ни в полосе, ни на складе. Переименуйте каждое по задаче.</p></div>
      <div class="ex"><p class="sit">Шаг 1. Один раз создать склад</p><div class="term">tmux new -d -s sklad</div><p>Отдельная сессия, куда будем убирать окна. <code>-d</code> — создать, но не входить в неё.</p></div>
      <div class="ex"><p class="sit">Шаг 2. Убрать лишние окна</p><div class="term">(встать в окно)  Ctrl+B, потом :  →  move-window -t sklad:  →  Enter</div><p>Повторить для каждого окна, которое сейчас не нужно. Из полосы <code>main</code> оно пропадает, программы в нём работают дальше.</p></div>
      <div class="ex"><p class="sit">Шаг 3. Найти и перейти: дерево всех окон</p><div class="term">Ctrl+B, потом w</div><p>Откроется дерево <b>всех сессий и окон</b>, включая склад, с предпросмотром содержимого. Стрелками выбрать окно, <b>Enter</b> — перейти в него, <b>q</b> — выйти без выбора. Стрелка вправо раскрывает сессию, влево сворачивает. <b>Не нажимайте x</b>: в дереве это «закрыть выбранное» (tmux переспросит y/n, ответьте n).</p></div>
      <div class="ex"><p class="sit">Шаг 4. Вернуться в main или вернуть окно</p><div class="term">Ctrl+B, потом (   или   )        перейти в предыдущую / следующую сессию
Ctrl+B, потом s                  список сессий, выбрать main и Enter
Ctrl+B, потом :  →  move-window -s sklad:bot    вернуть окно bot в полосу</div><p>После перехода в окно на складе вы оказываетесь в сессии <code>sklad</code>. Чтобы вернуться к <code>main</code>, переключите сессию. Если окно снова нужно постоянно, верните его в полосу через <code>move-window -s</code>.</p></div>
    </div>
    <div class="big-idea"><b>Можно вообще ничего не прятать.</b> Если окна мешают только тем, что их много в полосе, переключайтесь через <b>Ctrl+B, w</b>: удобный список с предпросмотром, и не нужно помнить номера. Прятать на склад стоит то, что долго не понадобится.</div>
    <div class="trap"><b>Не всё можно переносить и закрывать.</b> Некоторые программы находят своё окно tmux по имени или по сессии: агенты чата, боты, скрипты, которые туда что-то печатают. Если такое окно переименовать, перенести или закрыть, программа перестанет до него достучаться. Если не знаете, что работает в окне, не трогайте его и спросите того, кто его создал.</div>

    <div class="big-idea"><b>Главное.</b> Окно на ноутбуке больше не хозяин работы. Хозяин — сервер tmux. Поэтому, если работа долгая или связь ненадёжная, её начинают внутри tmux заранее, а не после обрыва.</div>
    <h3>Примеры из жизни</h3>
    <div class="examples">

      <div class="ex"><p class="sit">Утром подключились к серверу и попросили список сессий.</p><div class="term">rabota: 3 windows (created Thu Nov 12 18:40)
bot: 1 windows (created Mon Nov  9 10:02)</div><p><b>Что происходит.</b> Сессии жили всю ночь без вас. К любой можно подключиться и продолжить с того места.</p></div>
      <div class="ex"><p class="sit">После перезагрузки сервера:</p><div class="term">no server running on /tmp/tmux-1001/default</div><p><b>Что происходит.</b> Сервер tmux был процессом. Машину перезагрузили, процессов не осталось, сессий тоже. tmux спасает от обрыва связи, а не от выключения.</p></div>

        <li><b>Флаги</b> (опции) начинаются с минуса и меняют поведение: <code>-l</code> подробно, <code>-a</code> со скрытыми. Короткие можно склеить: <code>-la</code>. Длинные пишутся с двумя минусами: <code>--all</code>.</li>

        <li><b>Тишина — хороший знак.</b> Если команда ничего не написала и вернула приглашение, обычно это значит «сделано». Linux не хвалит, он сообщает только о проблемах.</li>

      <p class="lead">Настройки в Linux — это обычные текстовые файлы. Поэтому умение их читать и править важнее любой графической панели.</p>

    <div class="prose">

      <ul>
        <li><code>cat</code> вываливает файл целиком. Хорошо для коротких.</li>
        <li><code>less</code> показывает постранично. Листать пробелом, искать через <code>/слово</code>, выход — <code>q</code>.</li>
        <li><code>head</code> и <code>tail</code> показывают начало и конец. <code>tail -f</code> следит за файлом и показывает новые строки по мере появления. Так смотрят живые логи. Выход — Ctrl+C.</li>
      </ul>
      <p><b>Править:</b></p>
      <ul>
        <li><b>nano</b> — простой редактор. Подсказки внизу экрана, значок <code>^</code> значит Ctrl. Ctrl+O — сохранить, Ctrl+X — выйти.</li>
        <li><b>vim</b> — мощный и непривычный. У него <b>режимы</b>: в обычном режиме клавиши — это команды, а не буквы. Печатать можно только в режиме вставки (клавиша <code>i</code>). Чтобы выйти: <code>Esc</code>, затем <code>:q!</code> и Enter (без сохранения) или <code>:wq</code> и Enter (с сохранением).</li>
      </ul>
    </div>
    <div class="big-idea"><b>Два правила для настроек.</b> Первое: перед правкой сделайте копию (<code>cp nginx.conf nginx.conf.bak</code>), тогда всегда можно откатиться. Второе: служба читает настройки обычно <b>при запуске</b>. Сохранили файл — служба этого не заметит, пока её не перезапустят или не попросят перечитать.</div>

^G Help  ^O Write Out  ^W Where Is  ^X Exit</div><p><b>Как читать.</b> Нижняя строка nano — шпаргалка. <code>^O</code> значит Ctrl+O (сохранить), <code>^X</code> значит Ctrl+X (выйти).</p></div>

    </section>

      <h2>На минуту стать root и подключиться издалека</h2>
      <p class="lead">Две вещи, без которых работа на сервере не обходится: как сделать одно действие с правами root и что происходит, когда вы подключаетесь к серверу.</p>
    </header>
    <div class="prose">
      <h3>sudo</h3>
      <ul>
        <li><code>sudo команда</code> выполняет <b>одну</b> команду от имени root. Ядро видит процесс root, и права проверяются как для root.</li>
        <li>sudo спрашивает <b>ваш</b> пароль, а не пароль root. Так система проверяет, что за клавиатурой вы. Несколько минут после этого пароль не спрашивается повторно.</li>
        <li>Пользоваться sudo можно, только если админ вас разрешил (обычно это членство в группе <code>sudo</code> или <code>wheel</code>). Каждое использование записывается в журнал.</li>
        <li><b>Ловушка:</b> файл, созданный через sudo, принадлежит root. Потом уже без sudo вы получите на нём Permission denied.</li>
      </ul>
      <h3>SSH</h3>
      <ul>
        <li><code>ssh anna@server</code> открывает защищённое соединение и запускает на сервере оболочку под пользователем <code>anna</code> <b>сервера</b>. Это не ваш пользователь Windows.</li>
        <li><b>Вход по ключу.</b> Ключ — пара файлов. Закрытая часть хранится только у вас, как ключ от квартиры. Открытая лежит на сервере, как замок. Закрытым ключом не делятся никогда.</li>
        <li>При первом подключении спросят, доверяете ли вы серверу, и покажут его отпечаток. Так защищаются от подмены. Если позже ssh пишет, что отпечаток <b>изменился</b>, остановитесь и спросите админа.</li>
        <li>Сеанс SSH — это дерево процессов на сервере. Оборвалась связь — дерево получает сигнал обрыва. Поэтому долгую работу запускают в tmux.</li>
      </ul>
    </div>
    <section class="lab">
      <div class="lab-title"><span class="tag">модель</span><h3>sudo: кто на самом деле действует</h3></div>

      <h2>Терминал в кармане</h2>
      <p class="lead">К серверу можно подключиться прямо с телефона. Нужно приложение-терминал, адрес сервера, ваш логин и ключ. И обязательно tmux: телефон рвёт связь гораздо чаще компьютера.</p>
    </header>
    <div class="prose">
      <h3>Что поставить</h3>
      <p>На iPhone нет встроенного терминала, нужен SSH-клиент из App Store. Самые известные:</p>
      <ul>
        <li><b>Termius</b> — самый простой для начала. Базовое подключение по SSH бесплатное, умеет создавать ключи, есть строка дополнительных клавиш (Ctrl, Esc, Tab, стрелки).</li>
        <li><b>Blink Shell</b> — платный, для тех, кто много работает с телефона или iPad. Умеет <b>mosh</b>: соединение, которое переживает смену сети (Wi-Fi → мобильный интернет) и засыпание телефона.</li>
        <li><b>a-Shell</b> — бесплатный, больше для экспериментов, чем для работы.</li>
      </ul>
      <p>Устройство у всех одинаковое: это программа <code>ssh</code> из урока 14, только с кнопками.</p>
      <h3>Что нужно знать для подключения</h3>
      <ul>
        <li><b>Адрес сервера</b> — имя (например, <code>server.example.com</code>) или IP-адрес. Его даёт админ.</li>
        <li><b>Порт</b> — обычно 22. Если админ сказал другой, укажите его.</li>
        <li><b>Имя пользователя на сервере</b> — ваш логин там, не имя телефона.</li>
        <li><b>Ключ или пароль.</b> Лучше ключ: создайте его прямо в приложении. <b>Открытую</b> часть отправьте админу, он добавит её на сервер. <b>Закрытая</b> остаётся в телефоне и никуда не отправляется.</li>
      </ul>
      <h3>Особенности телефона</h3>
      <ul>
        <li><b>iPhone усыпляет приложения в фоне.</b> Переключились в мессенджер на пару минут — соединение может оборваться. Без tmux всё, что шло, получит сигнал обрыва. Поэтому правило для телефона: подключились — сразу <code>tmux attach</code> или <code>tmux new -s phone</code>.</li>
        <li><b>Клавиатура без Ctrl и Esc.</b> Приложения добавляют над клавиатурой строку со спецклавишами. Ctrl+B для tmux нажимается так: Ctrl в этой строке, потом b на клавиатуре.</li>
        <li><b>Смена сети</b> (ушли с Wi-Fi) тоже рвёт обычный SSH. Здесь помогают tmux и mosh.</li>
        <li><b>Маленький экран.</b> Панели tmux на телефоне неудобны. Лучше окна (Ctrl+B, c) и переключение между ними.</li>
        <li><b>Безопасность.</b> На телефоне должна стоять блокировка экрана: в нём лежит ваш закрытый ключ.</li>
      </ul>

<template id="t-final">
  <article class="lesson">
    <header class="lesson-head">
      <span class="eyebrow">Итог</span>
      <h2>Всё на одной странице</h2>
      <p class="lead">Если запомнить только это, большинство странностей терминала станут понятными.</p>
    </header>
    <div class="prose">
      <ul>
        <li><b>Устройство</b> — слои: железо, ядро, службы, оболочка или рабочий стол, программы. Программы только просят, а ядро делает и проверяет права. Компьютер и сервер различаются верхними слоями.</li>
        <li><b>Пользователь</b> — удостоверение. Система различает удостоверения, а не людей.</li>
        <li><b>Группа</b> — клуб, которому выдают доступ. Состав групп читается при входе.</li>
        <li><b>Права</b> — три категории (владелец, группа, остальные) по три разрешения (r, w, x). Проверка останавливается на первом совпадении. У папки w означает право удалять внутри.</li>
        <li><b>Процесс</b> — работающая программа с номером, владельцем и родителем. Работает с правами того, кто запустил.</li>
        <li><b>Передний план и фон</b> — кто из задач терминала владеет клавиатурой. Ctrl+Z замораживает, а не закрывает.</li>
        <li><b>tmux</b> — терминалы живут на сервере, а вы приходите и уходите.</li>
        <li><b>Песочница</b> — свой Linux (WSL), где ошибки ничего не стоят. Пароль при наборе не виден, так задумано.</li>
        <li><b>Пути</b> — одно дерево от <code>/</code>. Абсолютный путь от корня, относительный от текущей папки. <code>~</code> дом, <code>..</code> выше. Регистр важен.</li>
        <li><b>Команда</b> — команда, флаги, аргументы через пробел. Имена с пробелами в кавычки. Молчание значит успех. Tab, стрелка вверх, Ctrl+C.</li>
        <li><b>Файлы</b> — корзины нет, затирание без вопросов. Шаблон сначала проверить через ls. <code>rm -rf</code> — с особым вниманием.</li>
        <li><b>Чтение и правка</b> — less и tail -f для чтения, nano для правки. Выход из vim: Esc, <code>:q!</code> или <code>:wq</code>. Копия перед правкой, служба перечитывает настройки при перезапуске.</li>
        <li><b>Ошибки</b> — программа: что: причина. Начинать с первой. Permission denied — права, No such file — путь, command not found — имя программы.</li>
        <li><b>sudo и SSH</b> — sudo на одну команду и с вашим паролем. Файлы от sudo принадлежат root. Закрытый ключ никому. Изменился отпечаток сервера — стоп.</li>
        <li><b>tmux руками</b> — <code>tmux new -s имя</code> создать, Ctrl+B, d свернуть, <code>tmux ls</code> список, <code>tmux attach -t имя</code> вернуться, <code>exit</code> в последнем окне закрывает сессию насовсем.</li>
        <li><b>Сервер с iPhone</b> — приложение-терминал (Termius), адрес, порт, логин на сервере, ключ. Админу только открытую часть. Подключились — сразу tmux.</li>
        <li><b>Привычки</b> — посмотри, где ты. Проверь шаблон. Копия перед правкой. Долгое в tmux. Не уверен — Ctrl+C.</li>
      </ul>

  function wireQ(q, mode, onChange) {
    var qid = q.getAttribute("data-qid"), why = q.querySelector(".why");
    var tries = 0, finished = false;
    var badge = el("span", { class: "qpts" }); q.querySelector(".qt").appendChild(badge);
    if (mode === "lesson" && pts[qid] != null) {
      finished = true;
      var r = q.querySelector(".opt[data-ok]"); r.classList.add("right");
      why.hidden = false; why.className = "why ok"; why.textContent = r.getAttribute("data-why");
      badge.textContent = "+" + pts[qid];
    }
    q.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        var ok = o.hasAttribute("data-ok");
        if (mode === "exam") {
          if (finished) return;
          finished = true; srsRecord(qid, ok);
          o.classList.add(ok ? "right" : "wrong");
          if (!ok) q.querySelector(".opt[data-ok]").classList.add("right");
          why.hidden = false; why.className = "why " + (ok ? "ok" : "bad");
          why.textContent = (ok ? "Верно. " : "Ошибка. ") + q.querySelector(".opt[data-ok]").getAttribute("data-why");
          if (onChange) onChange(ok);
          return;
        }
        if (finished && !ok) { why.hidden = false; why.className = "why bad"; why.textContent = "Этот вариант неверный: " + o.getAttribute("data-why"); return; }
        if (finished) return;
        q.querySelectorAll(".opt").forEach(function (x) { x.classList.remove("wrong"); });
        o.classList.add(ok ? "right" : "wrong");
        why.hidden = false; why.className = "why " + (ok ? "ok" : "bad");
        if (tries === 0) srsRecord(qid, ok);
        if (ok) {
          var p = PTS[Math.min(tries, PTS.length - 1)];
          finished = true;
          if (mode === "lesson") { pts[qid] = p; store("lx-pts", pts); }
          else { p = tries === 0 ? 3 : 0; revPts += p; store("lx-rev", revPts); }
          badge.textContent = "+" + p;
          why.textContent = o.getAttribute("data-why") + (p ? " (+" + p + " " + (p === 1 ? "балл" : p < 5 ? "балла" : "баллов") + ")" : "");
          if (onChange) onChange();
        } else {
          tries++;
          var next = PTS[Math.min(tries, PTS.length - 1)];
          why.textContent = "Не совсем. " + o.getAttribute("data-why") + (mode === "lesson" ? " Попробуйте ещё: теперь за верный ответ " + next + "." : "");
        }
      });
    });
  }

    if (userGroups.indexOf(f.group) >= 0) return { ok: f.mode[3 + bit], via: "группа" };

  }

            b.addEventListener("click", function () { st.mode[i] = !st.mode[i]; draw(); });

      var f = { owner: "anna", group: "бухгалтерия", mode: st.mode, kind: st.kind };

  /* ---------- lesson 4 ---------- */
  function initProcs() {
    var nextPid, procs, sel, log, closed;
    function reset() {
      nextPid = 4120; sel = null; closed = false;
      procs = [
        { pid: 4101, name: "окно терминала", owner: "anna", parent: null, state: "работает", depth: 0 },
        { pid: 4102, name: "оболочка bash", owner: "anna", parent: 4101, state: "работает", depth: 1 }
      ];
      $("pr-log").innerHTML = '<span class="dim">журнал событий</span>';
      draw();
    }
    function say(s, cls) { var l = $("pr-log"); l.appendChild(el("span", { class: cls || "" }, s)); }
    function add(name, kind) {
      if (closed) { say("Терминал закрыт, запускать не из чего. Начните заново.", "bad"); return; }
      var p = { pid: nextPid++, name: name, owner: "anna", parent: 4102, state: "работает", depth: 2, kind: kind };
      procs.push(p); say("bash запустил «" + name + "», PID " + p.pid + ", владелец anna (унаследовано)", "ok"); sel = p.pid; draw();
    }
    function draw() {
      var t = $("pr-tree"); t.innerHTML = "";
      procs.forEach(function (p) {
        var b = el("button", { class: "pnode" + (p.pid === sel ? " sel" : "") + (p.state === "завершён" ? " dead" : ""), style: "margin-left:" + (p.depth * 22) + "px" });
        b.innerHTML = '<span class="pid">PID ' + p.pid + "</span><span>" + (p.depth ? "└ " : "") + p.name + ' <span class="owner">· ' + p.owner + '</span></span><span class="pill ' + (p.state === "работает" ? "yes" : p.state === "заморожен" ? "mid" : "no") + '">' + p.state + "</span>";
        b.addEventListener("click", function () { sel = p.pid; draw(); });
        t.appendChild(b);
      });
      var s = find(sel);
      $("pr-target").textContent = s ? "Сигнал для: " + s.name + " (" + s.pid + ")" : "Процесс не выбран";
    }
    function find(pid) { return procs.filter(function (p) { return p.pid === pid; })[0]; }
    function kids(pid) { return procs.filter(function (p) { return p.parent === pid; }); }
    function die(p, how) {
      if (p.state === "завершён") return;
      kids(p.pid).forEach(function (k) { die(k, "родитель исчез, пришёл сигнал обрыва"); });
      p.state = "завершён";
      say("✕ " + p.name + " (" + p.pid + "): " + how, "bad");
    }
    $("pr-editor").addEventListener("click", function () { add("редактор текста", "editor"); });
    $("pr-dl").addEventListener("click", function () { add("загрузка файла", "dl"); });
    $("pr-reset").addEventListener("click", reset);
    $("pr-close").addEventListener("click", function () {
      if (closed) return; closed = true;
      say("Окно терминала закрыто.", "hl");
      die(procs[0], "окно закрыто пользователем"); sel = null; draw();
    });
    $("pr-sig").querySelectorAll("[data-sig]").forEach(function (b) {
      b.addEventListener("click", function () {
        var p = find(sel); if (!p) { say("Сначала выберите процесс в дереве.", "dim"); return; }
        if (p.state === "завершён") { say("Этот процесс уже завершён, сигнал некому получить.", "dim"); return; }
        var s = b.getAttribute("data-sig");
        if (s === "stop") { p.state = "заморожен"; say("❚❚ " + p.name + " заморожен. Память цела, работа стоит.", "hl"); }
        else if (s === "cont") { if (p.state === "заморожен") { p.state = "работает"; say("▶ " + p.name + " продолжает с того же места.", "ok"); } else say(p.name + " и так работает.", "dim"); }
        else if (s === "term") {
          if (p.state === "заморожен") { say(p.name + " заморожен и не может обработать просьбу. Сначала продолжите его.", "hl"); return; }
          var how = p.kind === "editor" ? "сохранил черновик и аккуратно вышел" : p.kind === "dl" ? "удалил недокачанный кусок и вышел" : "аккуратно завершился";
          die(p, how);
        } else {
          var how2 = p.kind === "editor" ? "убит мгновенно, несохранённый текст потерян" : p.kind === "dl" ? "убит мгновенно, на диске остался битый кусок файла" : "убит мгновенно";
          die(p, how2);
        }
        draw();
      });
    });
    reset();
  }

  /* ---------- lesson 5 ---------- */
  function initJobs() {
    var jobs, n, closed, names = ["архивация фото", "сборка проекта", "проверка диска", "загрузка видео", "конвертация звука"];
    function reset() { jobs = []; n = 0; closed = false; $("j-log").innerHTML = '<span class="dim">anna@сервер:~$ _</span>'; draw(); }
    function say(s, cls) { var l = $("j-log"); l.appendChild(el("span", { class: cls || "" }, s)); while (l.children.length > 9) l.removeChild(l.firstChild); }
    function fg() { return jobs.filter(function (j) { return j.place === "fg" && j.state !== "done"; })[0]; }
    function live() { return jobs.filter(function (j) { return j.state !== "done" && j.state !== "dead"; }); }
    function start(place) {
      if (closed) { reset(); }
      if (fg()) { say("Клавиатура занята «" + fg().name + "». Оболочка новую команду не примет, пока передний план не освободится.", "bad"); return; }
      var j = { id: ++n, name: names[(n - 1) % names.length], p: 0, state: "run", place: place };
      jobs.push(j); say("[" + j.id + "] запущена «" + j.name + "» " + (place === "fg" ? "на переднем плане" : "в фоне"), "ok"); draw();
    }
    function draw() {
      var f = fg();
      $("j-kb").innerHTML = closed ? "Терминал закрыт. Нажмите любую кнопку запуска, чтобы открыть новый." : f ? (f.state === "run" ? "⌨ Клавиатура у задачи «<b>" + f.name + "</b>». Оболочка ждёт." : "") : "⌨ Клавиатура у <b>оболочки</b>. Можно запускать новое.";
      var L = $("j-list"); L.innerHTML = "";
      jobs.forEach(function (j) {
        var st = j.state === "run" ? (j.place === "fg" ? '<span class="pill yes">передний план</span>' : '<span class="pill yes">в фоне</span>') : j.state === "stop" ? '<span class="pill mid">заморожена</span>' : j.state === "done" ? '<span class="pill yes">готово</span>' : '<span class="pill no">завершена</span>';
        var d = el("div", { class: "job" + (j === f ? " fg" : "") });
        d.innerHTML = '<span class="name">[' + j.id + "] " + j.name + "</span>" + st + '<span class="jbar"><i style="width:' + j.p + '%"></i></span>';
        L.appendChild(d);
      });
      if (!jobs.length) L.appendChild(el("p", { class: "lab-hint" }, "Задач пока нет."));
    }
    $("j-fg").addEventListener("click", function () { start("fg"); });
    $("j-bg").addEventListener("click", function () { start("bg"); });
    $("j-type").addEventListener("click", function () {
      if (closed) return;
      var f = fg();
      if (f) say("Набранный текст получила «" + f.name + "». Фоновые задачи его не видят.", "hl");
      else say("anna@сервер:~$ привет  ← это прочитала оболочка", "");
    });
    $("j-cc").addEventListener("click", function () {
      var f = fg(); if (!f) { say("Ctrl+C: на переднем плане никого нет, оболочка просто начала новую строку.", "dim"); return; }
      f.state = "dead"; f.place = "bg"; say("^C  «" + f.name + "» завершена по просьбе.", "bad"); draw();
    });
    $("j-cz").addEventListener("click", function () {
      var f = fg(); if (!f) { say("Ctrl+Z: замораживать нечего, передний план пуст.", "dim"); return; }
      f.state = "stop"; f.place = "bg"; say("^Z  [" + f.id + "] «" + f.name + "» заморожена. Клавиатура вернулась оболочке.", "hl"); draw();
    });
    $("j-tobg").addEventListener("click", function () {
      var s = jobs.filter(function (j) { return j.state === "stop"; }).pop();
      if (!s) { say("Нет замороженных задач.", "dim"); return; }
      s.state = "run"; s.place = "bg"; say("[" + s.id + "] «" + s.name + "» продолжает в фоне.", "ok"); draw();
    });
    $("j-tofg").addEventListener("click", function () {
      if (fg()) { say("Передний план уже занят.", "dim"); return; }
      var s = jobs.filter(function (j) { return j.state === "run" || j.state === "stop"; }).pop();
      if (!s) { say("Нет задач, которые можно вернуть.", "dim"); return; }
      s.state = "run"; s.place = "fg"; say("[" + s.id + "] «" + s.name + "» снова на переднем плане и забрала клавиатуру.", "ok"); draw();
    });
    $("j-close").addEventListener("click", function () {
      if (closed) return;
      var l = live(); closed = true;
      l.forEach(function (j) { j.state = "dead"; });
      say("Терминал закрыт. Сигнал обрыва получили: " + (l.length ? l.map(function (j) { return "«" + j.name + "»"; }).join(", ") : "никто") + ".", "bad"); draw();
    });
    var timer = setInterval(function () {
      var ch = false;
      jobs.forEach(function (j) {
        if (j.state === "run") {
          j.p = Math.min(100, j.p + 1.4); ch = true;
          if (j.p >= 100) { j.state = "done"; say("[" + j.id + "] «" + j.name + "» готово.", "ok"); }
        }
      });
      if (ch) draw();
    }, 250);
    cleanup.push(function () { clearInterval(timer); });
    reset();
  }

  /* ---------- lesson 6 ---------- */
  function initTmux() {
    var st;
    function reset(mode) { st = { mode: mode, conn: true, task: null, second: false }; $("x-log").innerHTML = '<span class="dim">журнал событий</span>'; draw(); }
    function say(s, cls) { var l = $("x-log"); l.appendChild(el("span", { class: cls || "" }, s)); while (l.children.length > 8) l.removeChild(l.firstChild); }
    function taskHtml() {
      if (!st.task) return '<span class="lab-hint">задач нет</span>';
      var t = st.task;
      var lbl = t.dead ? '<span class="pill no">убита обрывом</span>' : t.p >= 100 ? '<span class="pill yes">готово</span>' : '<span class="pill yes">' + Math.floor(t.p) + "%</span>";
      return '<div class="inner' + (t.dead ? " dead" : "") + '">долгая задача (импорт базы) ' + lbl + "</div>";
    }
    function draw() {
      $("x-mode").querySelectorAll("button").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-mode") === st.mode); });
      $("x-link").classList.toggle("cut", !st.conn);
      $("x-link").querySelector("span").textContent = st.conn ? "связь есть" : "обрыв";
      var lap = "<h4>Ваш ноутбук</h4>";
      if (st.conn) lap += st.mode === "tmux" ? '<div class="inner">окно терминала<br><span class="lab-hint">просто экран: клиент tmux</span></div>' : '<div class="inner">окно терминала<br><span class="lab-hint">на нём держится вся работа</span></div>';
      else lap += '<div class="inner dead">окно закрыто</div>';
      if (st.second && st.mode === "tmux") lap += '<div class="inner">второй компьютер<br><span class="lab-hint">тот же экран, та же сессия</span></div>';
      $("x-laptop").innerHTML = lap;
      var srv = "<h4>Удалённый сервер</h4>";
      if (st.mode === "tmux") {
        srv += '<div class="inner tmux"><span class="t">сервер tmux · сессия «работа»</span><div class="inner">оболочка bash</div>' + taskHtml() + "</div>";
      } else {
        srv += st.conn || (st.task && !st.task.dead) ? '<div class="inner">оболочка bash ← родитель: ваше соединение</div>' + taskHtml() : '<div class="inner dead">оболочка bash</div>' + taskHtml();
      }
      $("x-server").innerHTML = srv;
      $("x-second").hidden = st.mode !== "tmux" || !st.conn;
      $("x-cut").disabled = !st.conn; $("x-back").disabled = st.conn;
    }
    $("x-mode").querySelectorAll("button").forEach(function (b) { b.addEventListener("click", function () { reset(b.getAttribute("data-mode")); }); });
    $("x-start").addEventListener("click", function () {
      if (!st.conn) { say("Сначала подключитесь.", "dim"); return; }
      if (st.task && !st.task.dead && st.task.p < 100) { say("Задача уже идёт.", "dim"); return; }
      st.task = { p: 0, dead: false }; say("Запущен импорт базы, займёт пару минут.", "ok"); draw();
    });
    $("x-cut").addEventListener("click", function () {
      st.conn = false; st.second = false; say("Крышка ноутбука закрыта, соединение оборвалось.", "hl");
      if (st.mode === "plain") { if (st.task && st.task.p < 100) { st.task.dead = true; say("Оболочка и её дети получили сигнал обрыва. Импорт убит на " + Math.floor(st.task.p) + "%.", "bad"); } }
      else say("Клиент отключился. Сервер tmux этого даже не заметил, задача идёт дальше.", "ok");
      draw();
    });
    $("x-back").addEventListener("click", function () {
      st.conn = true;
      if (st.mode === "tmux") say("Подключились к сессии «работа». Всё на месте, как и было.", "ok");
      else { say("Подключились. Вас встретила новая чистая оболочка, прежней работы нет.", "bad"); if (st.task && st.task.dead) {} }
      draw();
    });
    $("x-second").addEventListener("click", function () { st.second = true; say("Второй клиент подключился к той же сессии. Оба видят одно и то же.", "ok"); draw(); });
    var timer = setInterval(function () {
      if (st.task && !st.task.dead && st.task.p < 100) {
        st.task.p = Math.min(100, st.task.p + 1.2);
        if (st.task.p >= 100) say("Импорт базы завершён" + (st.conn ? "." : ", пока вас не было."), "ok");
        draw();
      }
    }, 250);
    cleanup.push(function () { clearInterval(timer); });
    reset("plain");

    /* sessions / windows / panes */
    var tm;
    var WN = ["редактор", "логи", "бот", "почта", "сборка"];
    function tmReset() { tm = { wins: [{ name: WN[0], panes: 1, act: 0 }], cur: 0 }; tmDraw(); }
    function tmDraw() {
      var w = tm.wins[tm.cur], box = $("tm-panes"); box.innerHTML = "";
      box.style.gridTemplateColumns = w.panes > 1 ? "1fr 1fr" : "1fr";
      for (var i = 0; i < w.panes; i++) {
        (function (i) {
          var p = el("button", { class: "pane" + (i === w.act ? " act" : ""), "aria-label": "панель " + (i + 1) });
          p.innerHTML = '<span class="dim">окно ' + tm.cur + " «" + w.name + "», панель " + i + "</span><span>anna@сервер:~$ " + (i === w.act ? "▌" : "") + "</span>";
          if (w.panes === 3 && i === 0) p.style.gridRow = "span 2";
          p.addEventListener("click", function () { w.act = i; tmDraw(); });
          box.appendChild(p);
        })(i);
      }
      var s = $("tm-status"); s.innerHTML = "<b>[работа]</b>";
      tm.wins.forEach(function (x, i) {
        var b = el("button", { class: "w" + (i === tm.cur ? " act" : "") }, i + ":" + x.name + (i === tm.cur ? "*" : ""));
        b.addEventListener("click", function () { tm.cur = i; tmDraw(); });
        s.appendChild(b);
      });
    }
    $("tm-win").addEventListener("click", function () { if (tm.wins.length >= 5) return; tm.wins.push({ name: WN[tm.wins.length], panes: 1, act: 0 }); tm.cur = tm.wins.length - 1; tmDraw(); });
    $("tm-split").addEventListener("click", function () { var w = tm.wins[tm.cur]; if (w.panes < 3) { w.panes++; w.act = w.panes - 1; } tmDraw(); });
    $("tm-reset").addEventListener("click", tmReset);
    tmReset();
    initTmuxCli();
  }

  /* tmux command trainer: shell <-> tmux sessions, detach/attach, windows, panes, scroll */
  function initTmuxCli() {
    var S = {}, att = null, nextAuto = 0, scroll = false, tree = null;
    function say(s, cls) { var l = $("tc-log"); l.appendChild(el("span", { class: cls || "" })).textContent = s; while (l.children.length > 10) l.removeChild(l.firstChild); }
    function cur() { return att ? S[att] : null; }
    function newSession(name) {
      S[name] = { wins: [{ name: "bash", panes: 1, task: null }], cur: 0, made: new Date() };
      att = name; scroll = false;
    }
    function draw() {
      var scr = $("tc-screen");
      if (!att) {
        scr.innerHTML = '<div class="tm-body"><span>anna@server:~$ ▌</span><span class="dim">Вы в обычной оболочке, вне tmux.</span></div>';
      } else if (tree) {
        var h = '<div class="tm-tree"><div class="dim">' + (tree === "w" ? "Дерево сессий и окон: выберите окно (Enter), выход — кнопка q" : "Сессии: выберите (Enter), выход — кнопка q") + "</div>";
        Object.keys(S).forEach(function (k) {
          h += '<button class="tm-node" data-s="' + esc(k) + '" data-w="-1">' + (k === att ? "▸ " : "  ") + esc(k) + ": " + S[k].wins.length + " windows" + (k === att ? " (attached)" : "") + "</button>";
          if (tree === "w") S[k].wins.forEach(function (w, i) { h += '<button class="tm-node sub" data-s="' + esc(k) + '" data-w="' + i + '">    ' + i + ": " + esc(w.name) + (w.task ? " — задача " + Math.floor(w.task.p) + "%" : "") + "</button>"; });
        });
        scr.innerHTML = h + "</div>";
        scr.querySelectorAll(".tm-node").forEach(function (b) {
          b.addEventListener("click", function () {
            var k = b.getAttribute("data-s"), i = +b.getAttribute("data-w");
            if (!S[k]) return;
            att = k; if (i >= 0) S[k].cur = i; tree = null;
            say("Перешли в " + k + (i >= 0 ? ":" + S[k].wins[i].name : "") + "." + (k !== "main" && k !== "rabota" ? " Вернуться в прежнюю сессию: Ctrl+B, ( или )." : ""), "ok");
            draw();
          });
        });
      } else {
        var s = cur(), w = s.wins[s.cur];
        var body = '<div class="tm-panes" style="grid-template-columns:' + (w.panes > 1 ? "1fr 1fr" : "1fr") + '">';
        for (var i = 0; i < w.panes; i++) body += '<div class="tm-pane">' + (i === 0 && w.task ? "импорт базы: " + Math.floor(w.task.p) + "%" + (w.task.p >= 100 ? " — готово" : "") : "anna@server:~$ ▌") + "</div>";
        body += "</div>";
        var bar = "[" + esc(att) + "] " + s.wins.map(function (x, i) { return i + ":" + esc(x.name) + (i === s.cur ? "*" : ""); }).join("  ");
        scr.innerHTML = (scroll ? '<div class="tm-scroll">[режим прокрутки: листайте стрелками, выход — q]</div>' : "") + body + '<div class="status">' + bar + "</div>";
      }
      var names = Object.keys(S);
      $("tc-pref").querySelectorAll("button").forEach(function (b) { b.disabled = !att; });
